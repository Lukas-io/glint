name: Tag release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Find a merged release PR
        id: release
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          branch="$(printf '%s\n' "$MESSAGE" | head -1 | sed -nE 's#^Merge pull request \#[0-9]+ from [^/]+/release/([a-z_]+-v[0-9]+\.[0-9]+\.[0-9]+)$#\1#p')"
          if [ -z "$branch" ]; then
            echo "not a release merge"
            exit 0
          fi
          echo "tag=$branch" >> "$GITHUB_OUTPUT"
          echo "package=${branch%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${branch##*-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.tag != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Tag the release and start the Release workflow
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -qx "version: $VERSION" "packages/$PACKAGE/pubspec.yaml" || { echo "packages/$PACKAGE/pubspec.yaml is not at $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" "packages/$PACKAGE/CHANGELOG.md" || { echo "packages/$PACKAGE/CHANGELOG.md has no $VERSION section"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $PACKAGE $VERSION" "$SHA"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
          echo "tagged $TAG at $SHA and started the Release workflow"
