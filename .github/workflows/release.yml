name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check the tag matches the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version: $version" pubspec.yaml || { echo "pubspec.yaml is not at $version"; exit 1; }
          dart run tool/release.dart notes "$version" > release-notes.md
      - name: Test
        run: dart test
        env:
          GLINT_NO_TELEMETRY: 'true'
      - name: Build the universal glint-iossim bridge
        working-directory: native/ios_sim_bridge
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/glint-iossim"
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --force --sign - "$bin"
          codesign --verify "$bin"
          "$bin" version
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$bin" "$RUNNER_TEMP/assets/glint-iossim-macos"
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 glint-iossim-macos > glint-iossim-macos.sha256
          cat glint-iossim-macos.sha256
      - name: Publish the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            "$RUNNER_TEMP/assets/glint-iossim-macos" "$RUNNER_TEMP/assets/glint-iossim-macos.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
