name: Release

on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      package: ${{ steps.tag.outputs.package }}
    env:
      GLINT_NO_TELEMETRY: 'true'
      GLINT_NETWORK_NO_TELEMETRY: 'true'
      GLINT_NETWORK_NO_UPDATE_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check the tag matches the code
        id: tag
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "run this workflow on a release tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"; exit 1; }
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          [ -d "packages/$package" ] || { echo "no package named $package"; exit 1; }
          grep -qx "version: $version" "packages/$package/pubspec.yaml" || { echo "packages/$package/pubspec.yaml is not at $version"; exit 1; }
          dart run tool/release.dart notes "$package" "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: packages/${{ steps.tag.outputs.package }}
        run: dart test
      - name: Build the universal glint-iossim bridge
        if: steps.tag.outputs.package == 'glint_mcp'
        working-directory: packages/glint_mcp/native/ios_sim_bridge
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/glint-iossim"
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --force --sign - "$bin"
          codesign --verify "$bin"
          "$bin" version
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$bin" "$RUNNER_TEMP/assets/glint-iossim-macos"
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 glint-iossim-macos > glint-iossim-macos.sha256
          cat glint-iossim-macos.sha256
      - name: Build the universal glint-devicehid helper
        if: steps.tag.outputs.package == 'glint_mcp'
        working-directory: packages/glint_mcp/native/ios_device_hid
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/assets"
          bin="$RUNNER_TEMP/assets/glint-devicehid-macos"
          lipo -create -output "$bin" target/aarch64-apple-darwin/release/glint-devicehid target/x86_64-apple-darwin/release/glint-devicehid
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --force --sign - "$bin"
          "$bin" version
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 glint-devicehid-macos > glint-devicehid-macos.sha256
          cat glint-devicehid-macos.sha256
      - name: Build the glint Android server
        if: steps.tag.outputs.package == 'glint_mcp'
        working-directory: packages/glint_mcp/native/android_server
        run: |
          ./build.sh
          mkdir -p "$RUNNER_TEMP/assets"
          cp build/glint-android-server.dex "$RUNNER_TEMP/assets/glint-android-server.dex"
          cd "$RUNNER_TEMP/assets"
          shasum -a 256 glint-android-server.dex > glint-android-server.dex.sha256
          cat glint-android-server.dex.sha256
      - name: Publish the GitHub Release
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/assets/*)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: release
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/${{ needs.release.outputs.package }}
