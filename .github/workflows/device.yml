name: Device check

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      flutter-channel:
        description: Flutter channel to build the fixture with
        default: stable
        type: choice
        options: [stable, beta]

permissions:
  contents: read

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ inputs.flutter-channel || (github.event.schedule == '0 5 * * 0' && 'beta') || 'stable' }}
      - run: dart pub get
      - run: flutter pub get
        working-directory: fixtures/counter_app
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: tool/ci/run_device_check.sh android emulator-5554
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-logs
          path: device-check-flutter-run.log

  ios:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ inputs.flutter-channel || (github.event.schedule == '0 5 * * 0' && 'beta') || 'stable' }}
      - run: dart pub get
      - run: flutter pub get
        working-directory: fixtures/counter_app
      - name: Build the simulator bridge
        run: swift build
        working-directory: native/ios_sim_bridge
      - name: Boot a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devices if 'SimRuntime.iOS' in k and devices[k]), key=lambda k: [int(x) for x in k.split('iOS-')[1].split('-')])
          if not ios: sys.exit('no iOS simulator on this runner')
          phones = [d for d in devices[ios[-1]] if d['name'].startswith('iPhone')]
          plain = [d for d in phones if not any(w in d['name'] for w in ('Pro', 'Plus', 'Max', 'SE', 'Air'))]
          print((plain or phones)[0]['udid'])
          ")
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the device check
        run: tool/ci/run_device_check.sh ios ${{ steps.sim.outputs.udid }}
      - if: failure()
        run: xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot ios-failure.png || true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-logs
          path: |
            device-check-flutter-run.log
            ios-failure.png
