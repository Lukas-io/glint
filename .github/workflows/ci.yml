name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GLINT_NO_TELEMETRY: 'true'
  GLINT_NETWORK_NO_TELEMETRY: 'true'
  GLINT_NETWORK_NO_UPDATE_CHECK: 'true'

jobs:
  changes:
    name: Changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      bridge: ${{ steps.pick.outputs.bridge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        run: tool/ci/changed_packages.sh "${{ github.event.pull_request.base.sha || github.event.before }}" | tee -a "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.package }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-warnings $(ls -d lib bin test 2>/dev/null)
      - name: Test
        run: dart test

  tooling:
    name: Repo tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-warnings tool
      - name: Test
        run: dart test tool/test

  ios-bridge:
    name: iOS simulator bridge (Swift)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        working-directory: packages/glint_mcp/native/ios_sim_bridge
        run: |
          swift build
          .build/debug/glint-iossim version

  passed:
    name: CI passed
    needs: [changes, package, tooling, ios-bridge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
