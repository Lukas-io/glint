name: glint_mcp
description: MCP server that lets AI agents drive running Flutter apps on simulators, emulators and iPhones, with zero app code, render-tree perception and real input.
version: 0.4.1
repository: https://github.com/Lukas-io/glint/tree/main/packages/glint_mcp
issue_tracker: https://github.com/Lukas-io/glint/issues
homepage: https://github.com/Lukas-io/glint
topics:
  - mcp
  - flutter
  - agents
  - automation
  - simulator

environment:
  sdk: ^3.6.0

resolution: workspace

executables:
  glint:

dependencies:
  args: ^2.5.0
  crypto: ^3.0.0
  dart_mcp: ^0.5.1
  glint_core: ^0.1.1
  dtd: ^4.0.0
  meta: ^1.15.0
  path: ^1.9.0
  vm_service: ^15.0.0
  grpc: ^5.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
